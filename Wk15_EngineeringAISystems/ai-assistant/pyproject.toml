[project]
name = "ai-assistant"
version = "0.3.0"
description = "Research-paper RAG assistant (W15) + agentic research loop (W16) + MLOps (W17 Track B)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.50",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "numpy>=1.26,<2.3",
    "pypdf>=4.3",
    "chromadb>=0.5.5",
    "fastembed>=0.4",
    "rank-bm25>=0.2.2",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38"]
# Only needed once, to export the W14 router to ONNX (heavy: pulls torch)
export = ["torch>=2.3", "transformers>=4.48", "onnx>=1.16", "onnxscript>=0.1"]
mlops = ["mlflow>=2.16,<3", "evidently[llm]>=0.4.40,<0.7", "pandas>=2.2", "tabulate>=0.9"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
