[project]
name = "churn-mlops"
version = "1.0.0"
description = "Telco churn: uv + MLflow tracking/registry + serving + Evidently drift monitoring (+ Airflow)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26,<2.3",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "mlflow>=2.16,<3",
    "evidently>=0.4.40,<0.7",   # legacy Report/TestSuite API incl. TargetDriftPreset
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "requests>=2.32",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
churn-pipeline = "churn.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.pytest.ini_options]
pythonpath = ["src"]
